[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "voiceveritas"
version = "0.1.3"
description = "Detect whether interview answers are read/recited from a script or spoken spontaneously. Audio-only, open-source anti-cheat for AI interviews."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "VoiceVeritas Contributors" }]
keywords = [
    "speech",
    "anti-cheating",
    "interview",
    "read-speech-detection",
    "spontaneous-speech",
    "prosody",
    "wav2vec2",
    "audio-classification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "praat-parselmouth>=0.4.3",
    "lightgbm>=4.1",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
deep = [
    "torch>=2.1",
    "transformers>=4.38",
    "safetensors>=0.4",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
asr = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "httpx>=0.27",
    "types-PyYAML",
    "types-tqdm",
]

[project.scripts]
vv = "voiceveritas.cli:main"

[project.urls]
Homepage = "https://github.com/StanleyChanH/VoiceVeritas"
Repository = "https://github.com/StanleyChanH/VoiceVeritas"
Issues = "https://github.com/StanleyChanH/VoiceVeritas/issues"
Changelog = "https://github.com/StanleyChanH/VoiceVeritas/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceveritas"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "configs", "scripts", "README.md", "LICENSE"]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# B011: pytest.fail(False) idiom; I001: import order in tests is cosmetic and
# its "correct" answer varies across environments (venv-aware classification)
"tests/*" = ["B011", "I001"]
"src/voiceveritas/api/*" = ["B008"]  # FastAPI idiom: File/Form defaults

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
    "network: tests that require internet access",
]
filterwarnings = [
    "ignore::DeprecationWarning:lightgbm.*",
    "ignore:.*The argument 'eval_set' is deprecated.*:",
]
