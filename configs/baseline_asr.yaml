# Track A+ASR: prosody + lexical/alignment features -> LightGBM
# Requires the [asr] extra (faster-whisper): uv sync --extra asr
# Doc: docs/benchmark.md — ASR-block results

manifests:
  - data/manifests/benchmark.jsonl

max_duration_s: 30.0
min_duration_s: 2.0
feature_cache_dir: runs/feature_cache

train_ratio: 0.7
val_ratio: 0.15
seed: 42

use_asr: true
compute_ppl: false        # GPT-2 perplexity; needs [deep], ~0.5s/utt slower
use_asr_conf: false       # whisper-confidence = channel proxy, off by default

lgbm_params:
  objective: binary
  metric: auc
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 10
  feature_fraction: 0.9
  bagging_fraction: 0.9
  bagging_freq: 1
  verbosity: -1

num_boost_round: 500
early_stopping_rounds: 50
calibrate: true

name: baseline_asr
run_dir: ""
